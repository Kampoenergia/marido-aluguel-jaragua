services:
  - type: web
    name: marido-aluguel-jaragua
    runtime: static
    buildCommand: "echo 'Static site: no build required'"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
